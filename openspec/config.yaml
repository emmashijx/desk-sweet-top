schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  项目目标：为 MacBook Air 打造完全自定义的桌面，以可交互的平面图作为主界面。
  界面要求：桌面上的组件和图标均采用自定义设计，界面中不显示 macOS 自带的组件或图标。
  布局要求：用户后期可以调整 desktop 布局；当前房间效果图仅作视觉参考，不作为包含全部家具的固定交互背景。
  素材与布局：房间背景与可移动家具、组件分别制作；布局使用独立配置记录各元素的位置、大小、层级与显示状态，交互区域随元素同步更新。
  编辑布局：用户通过「编辑布局」入口进入独立编辑模式，可以拖动家具、调整家具大小，以及从家具库增加新家具。编辑时家具操作用于布局调整，不触发正常桌面的点击功能。
  保存流程：用户点击「保存」后持久化当前布局，退出编辑模式并返回正常桌面；正常桌面使用已保存的布局，家具恢复各自的点击功能。
  布局状态：日间与夜间共用布局配置；再次打开桌面时恢复已保存的布局，并支持恢复默认布局。
  待设计：明确平面图上的交互功能，以及进入和退出自定义桌面的方式。

